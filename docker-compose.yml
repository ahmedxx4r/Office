services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual_office
      POSTGRES_USER: office
      POSTGRES_PASSWORD: change-this-password
    ports: ["5432:5432"]
    volumes: ["office-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U office -d virtual_office"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["office-redis:/data"]
volumes:
  office-postgres:
  office-redis:
